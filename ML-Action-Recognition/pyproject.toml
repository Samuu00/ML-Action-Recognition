[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-recognition"
version = "0.1.0"
description = "Real-time gesture recognition using pose estimation and ONNX inference."
authors = [{ name = "Software Engineer", email = "dev@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "onnxruntime>=1.15.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]