camera:
  device_id: 0
  width: 1280
  height: 720
  target_fps: 30

feature_extraction:
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.7
  num_landmarks: 33  # MediaPipe Pose Standard Keypoints

pipeline:
  window_size: 30    # Frame temporali per finestra (1 sec a 30 FPS)
  smoothing_window: 5 # Dimensione finestra per il Moving Average delle predizioni
  prediction_threshold: 0.75 # Soglia di confidenza minima

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  model_onnx_path: "data/gesture_model.onnx"
  classes:
    - "no_gesture"
    - "wave_hand"
    - "raise_arm"
    - "swipe_left"